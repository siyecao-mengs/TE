<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: 'Microsoft YaHei', SimHei, sans-serif;
            padding: 20px 24px;
            color: #333;
            line-height: 1.9;
            background: #fff;
        }
        h1 {
            font-size: 20px;
            font-weight: bold;
            color: #000;
            margin: 8px 0 16px 0;
        }
        p {
            font-size: 14px;
            color: #555;
            margin: 8px 0;
        }
        ul {
            margin: 8px 0;
            padding-left: 20px;
        }
        li {
            font-size: 14px;
            color: #555;
            margin: 4px 0;
        }
        .note {
            margin-top: 16px;
            padding: 12px 16px;
            background: #f5f5f5;
            border-left: 3px solid #4A9EFF;
            border-radius: 4px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
    <h1>什么是已收录终端？</h1>
    
    <p>已收录终端是指 <b>TE 终端盒子</b>已经完成适配和美化，可直接使用的终端类型。</p>
    
    <p>当前版本已内置 Windows 平台的 <b>CMD</b>（命令提示符）和 <b>PowerShell</b> 两款终端，它们已通过 TE 的美化引擎进行了界面优化</p>
   
    <div class="note">
        未来版本将支持从 GitHub 下载更多终端的收录包（如 Kali Linux、Ubuntu、SSH 远程终端等），安装后即可在 TE 中获得同样优质的美化体验。
    </div>
</body>
</html>
